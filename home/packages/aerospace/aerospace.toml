# Reference: https://github.com/i3/i3/blob/next/etc/config

config-version = 2

# In i3, all workspaces are phantom
persistent-workspaces = []

# Startup is managed by home-manager's launchd agent (programs.aerospace.launchd),
# not by AeroSpace itself — keep this false to avoid a double login item.
start-at-login = false

# i3 doesn't have "normalizations" feature that why we disable them here.
# But the feature is very helpful.
# Normalizations eliminate all sorts of weird tree configurations that don't make sense.
# Give normalizations a chance and enable them back.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Default layout
default-root-container-layout = 'tiles'

# Default orientation
# default-root-container-orientation = 'auto'

# exec-on-workspace-change is broken in aerospace 0.20.3-Beta
# Using exec-and-forget in keybindings as workaround

[mode.main.binding]
    # See: https://nikitabobko.github.io/AeroSpace/goodies#open-a-new-window-with-applescript
    alt-enter = '''exec-and-forget osascript -e '
    tell application "Terminal"
        do script
        activate
    end tell'
    '''

    # i3 wraps focus by default
    alt-h =         'focus --boundaries-action wrap-around-the-workspace left'
    alt-j =         'focus --boundaries-action wrap-around-the-workspace down'
    alt-k =         'focus --boundaries-action wrap-around-the-workspace up'
    alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'


    # Consider using 'join-with' command as a 'split' replacement if you want to enable
    # normalizations
    # alt-h = 'split horizontal'
    # alt-v = 'split vertical'

    alt-f = 'fullscreen'

    alt-s = 'layout v_accordion' # 'layout stacking' in i3
    alt-w = 'layout h_accordion' # 'layout tabbed' in i3
    alt-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

    alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

    # Not supported, because this command is redundant in AeroSpace mental model.
    # See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
    #alt-space = 'focus toggle_tiling_floating'

    # `focus parent`/`focus child` are not yet supported, and it's not clear whether they
    # should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
    # alt-a = 'focus parent'

    alt-1 = ['workspace 1', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=1']
    alt-2 = ['workspace 2', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=2']
    alt-3 = ['workspace 3', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=3']
    alt-4 = ['workspace 4', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=4']
    alt-5 = ['workspace 5', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=5']
    alt-6 = ['workspace 6', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=6']
    alt-7 = ['workspace 7', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=7']
    alt-8 = ['workspace 8', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=8']
    alt-9 = ['workspace 9', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=9']
    alt-0 = ['workspace 10', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=10']

    alt-shift-1 = ['move-node-to-workspace 1', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=1']
    alt-shift-2 = ['move-node-to-workspace 2', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=2']
    alt-shift-3 = ['move-node-to-workspace 3', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=3']
    alt-shift-4 = ['move-node-to-workspace 4', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=4']
    alt-shift-5 = ['move-node-to-workspace 5', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=5']
    alt-shift-6 = ['move-node-to-workspace 6', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=6']
    alt-shift-7 = ['move-node-to-workspace 7', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=7']
    alt-shift-8 = ['move-node-to-workspace 8', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=8']
    alt-shift-9 = ['move-node-to-workspace 9', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=9']
    alt-shift-0 = ['move-node-to-workspace 10', 'exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=10']

    alt-shift-c = 'reload-config'

    alt-r = 'mode resize'

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    enter = 'mode main'
    esc = 'mode main'


[gaps.inner]
horizontal  = 10
vertical    = 10

[gaps.outer]
top         = 10
bottom      = 10
left        = 10
right       = 10

