# tmux.conf — STARTER. Replace with your real tmux config.
# Edited as a normal file; read verbatim by tmux.nix.

# Use a more ergonomic prefix (uncomment to switch from C-b to C-a)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000

# 256-color / truecolor
set -g default-terminal "tmux-256color"
